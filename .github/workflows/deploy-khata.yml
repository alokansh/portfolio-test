name: Deploy Khata sandbox to Pages

on:
  push:
    branches: [main]
    paths:
      - "sandbox/khata/**"
      - ".github/workflows/deploy-khata.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-khata
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Khata
        working-directory: sandbox/khata
        run: |
          npm install
          npm run build

      - name: Stage artifact under sandbox/khata/
        # deploy-pages publishes the artifact as the site root,
        # so we nest the built files at sandbox/khata/ to keep the URL
        # https://alokansh.github.io/portfolio-test/sandbox/khata/
        run: |
          mkdir -p public-sandbox/sandbox/khata
          cp -r sandbox/khata/dist/* public-sandbox/sandbox/khata/
          # keep the existing test portfolio intact at the root
          cp -r index.html styles.css script.js public-sandbox/ 2>/dev/null || true
          cp -r assets public-sandbox/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-sandbox

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://alokansh.github.io/portfolio-test/sandbox/khata/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
